server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/univ_notice}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:validate}
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:notice-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      auto-startup: ${KAFKA_ENABLED:false}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp:
        auth: ${MAIL_AUTH:true}
        starttls.enable: ${MAIL_STARTTLS:true}
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
app:
  jwt-secret: ${JWT_SECRET}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:}
  notice-topic: ${NOTICE_TOPIC:notice}
  ingestion-key: ${INGESTION_KEY:}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
